<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo da Mente | Autoajuda Sem Mimimi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="badge"><i class="fa-solid fa-user-ninja"></i> Diagnóstico de Postura</div>
            <h1>Dojo da Mente</h1>
            <p class="subtitle">Aprenda a apanhar da vida sem perder a guarda.</p>
        </header>

        <main id="quiz-section">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Pergunta 1 de 6</div>

            <div class="question-box">
                <h2 class="question-title" id="question-text">Carregando pergunta...</h2>
                <div class="options-list" id="options-container"></div>
            </div>
        </main>

        <section id="result-section" class="result-box" style="display: none;">
            <div class="result-icon" id="result-icon"><i class="fa-solid fa-trophy"></i></div>
            <h2 class="result-title" id="result-title">Seu Perfil</h2>
            <div class="result-desc" id="result-desc">...</div>
            
            <div class="actions-group">
                <button class="btn-primary" onclick="restartQuiz()">
                    <i class="fa-solid fa-rotate-right"></i> Refazer Diagnóstico
                </button>
                <button class="btn-secondary" onclick="shareResult()">
                    <i class="fa-solid fa-share-nodes"></i> Compartilhar
                </button>
            </div>
        </section>

        <div id="history-box" class="history-box" style="display: none;">
            <p><i class="fa-solid fa-clock-rotate-left"></i> <strong>Último Resultado:</strong> <span id="last-result-text">--</span></p>
        </div>

        <hr class="divider">

        <footer class="generator-box">
            <h3><i class="fa-solid fa-bolt"></i> Puxão de Orelha Sem Filtro</h3>
            <div class="advice-card">
                <p class="advice-text" id="advice-display">"Clique no botão para receber a real do tatame."</p>
            </div>
            <button class="btn-secondary" onclick="generateAdvice()">
                <i class="fa-solid fa-dice"></i> Gerar Conselho
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
