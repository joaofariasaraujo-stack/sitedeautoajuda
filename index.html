<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Tatame da Vida</title>
    <style>
        /* CSS: Estilo focado, escuro e moderno */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #ff4757;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .options-list {
            list-style: none;
        }

        .option-btn {
            width: 100%;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .option-btn:hover {
            background-color: #ff4757;
            border-color: #ff4757;
        }

        .result-box {
            display: none;
            text-align: center;
        }

        .result-title {
            font-size: 1.5rem;
            color: #ff4757;
            margin-bottom: 15px;
        }

        .result-desc {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #ddd;
        }

        .btn-restart {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-restart:hover {
            background-color: #e03e4d;
        }

        hr {
            border: 0;
            height: 1px;
            background: #333;
            margin: 30px 0;
        }

        .generator-box {
            text-align: center;
            margin-top: 20px;
        }

        .advice-text {
            font-style: italic;
            margin: 15px 0;
            color: #2ed573;
            font-size: 1.1rem;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="quiz-section">
            <h1>Diagnóstico do Tatame</h1>
            <p class="subtitle">Descubra qual é a sua verdadeira postura na luta da vida.</p>

            <div class="question-box">
                <div class="question-title" id="question-text">Carregando pergunta...</div>
                <div class="options-list" id="options-container"></div>
            </div>
        </div>

        <div id="result-section" class="result-box">
            <div class="result-title" id="result-title">Seu Perfil</div>
            <div class="result-desc" id="result-desc">...</div>
            <button class="btn-restart" onclick="restartQuiz()">Refazer o Teste</button>
        </div>

        <hr>

        <div class="generator-box">
            <h3>Puxão de Orelha Aleatório</h3>
            <div class="advice-text" id="advice-display">Clique no botão abaixo para receber a real.</div>
            <button class="btn-restart" style="background-color: #2a2a2a; border: 1px solid #555;" onclick="generateAdvice()">Gerar Conselho</button>
        </div>
    </div>

    <script>
        // JAVASCRIPT: Lógica do Quiz e Gerador
        const questions = [
            {
                question: "1. A vida te acerta um 'cruzado de esquerda' (um imprevisto pesado acontece). Qual é a sua reação?",
                options: [
                    { text: "Fico reclamando no chão esperando alguém me ajudar.", type: "vitima" },
                    { text: "Saio batendo no ar feito maluco sem saber pra onde ir.", type: "desesperado" },
                    { text: "Recuo um passo, ajusto a guarda e analiso o próximo passo.", type: "faixapreta" }
                ]
            },
            {
                question: "2. Como está a sua rotina de 'treino' (seus objetivos diários)?",
                options: [
                    { text: "Assisto mil tutoriais/livros, mas não pratico nada.", type: "vitima" },
                    { text: "Tento fazer tudo no primeiro dia, me me esgoto e desisto na terça.", type: "desesperado" },
                    { text: "Faço o básico bem-feito todo santo dia, sem mimimi.", type: "faixapreta" }
                ]
            },
            {
                question: "3. O que você faz quando percebe que é muito ruim em alguma coisa nova?",
                options: [
                    { text: "Fico com vergonha e nunca mais tento.", type: "vitima" },
                    { text: "Fingo que sei tudo para não parecer fraco.", type: "desesperado" },
                    { text: "Aceito que sou faixa-branca e sigo treinando pra melhorar.", type: "faixapreta" }
                ]
            }
        ];

        const profiles = {
            vitima: {
                title: "Perfil: O 'Saco de Pancadas' Voluntário",
                desc: "Sinceridade pura: você está se deixando vencer antes do round começar. Ficar reclamando no tatame não faz o adversário parar de bater. Pare de esperar um milagre, levante a guarda e assuma a responsabilidade pela sua vida."
            },
            desesperado: {
                title: "Perfil: O Reativo Sem Gás",
                desc: "Você gasta toda a sua energia no pânico do primeiro minuto. Quer resolver tudo pra ontem, mas não tem consistência. Respire, pare de dar soco no vento e foque em dar um passo de cada vez com técnica."
            },
            faixapreta: {
                title: "Perfil: Mentalidade Faixa-Preta",
                desc: "Você entende que apanhar faz parte do processo, desde que aprenda a se defender. Mantém a calma, aceita os erros sem drama e sabe que a constância supera qualquer talento natural. Siga o plano."
            }
        };

        const advices = [
            "Ninguém vai vir te salvar. O treino é seu, a vida é sua.",
            "Estar cansado é normal. Desistir é opção de quem se acomodou.",
            "Menos teoria no papel, mais repeticação na prática.",
            "O ego é o adversário que mais vai te nocautear. Mantenha a humildade.",
            "Fazer o básico bem-feito todo dia é melhor do que dar um show uma vez no ano.",
            "Apanhou da rotina hoje? Limpe a poeira, ajuste a postura e volte amanhã."
        ];

        let currentQuestion = 0;
        let scores = { vitima: 0, desesperado: 0, faixapreta: 0 };

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                container.appendChild(btn);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestion++;

            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';

            let winner = 'vitima';
            if (scores.desesperado >= scores.vitima && scores.desesperado >= scores.faixapreta) {
                winner = 'desesperado';
            }
            if (scores.faixapreta >= scores.vitima && scores.faixapreta >= scores.desesperado) {
                winner = 'faixapreta';
            }

            document.getElementById('result-title').innerText = profiles[winner].title;
            document.getElementById('result-desc').innerText = profiles[winner].desc;
        }

        function restartQuiz() {
            currentQuestion = 0;
            scores = { vitima: 0, desesperado: 0, faixapreta: 0 };
            document.getElementById('quiz-section').style.display = 'block';
            document.getElementById('result-section').style.display = 'none';
            loadQuestion();
        }

        function generateAdvice() {
            const randomIndex = Math.floor(Math.random() * advices.length);
            document.getElementById('advice-display').innerText = `"${advices[randomIndex]}"`;
        }

        // Inicializa a primeira pergunta
        loadQuestion();
    </script>
</body>
</html>
